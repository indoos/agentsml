name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pyyaml

      - name: Validate JSON Schemas
        run: |
          python -c '
          import json, jsonschema
          for path in ["schemas/agentsml.schema.json", "schemas/v0.1/agentsml.schema.json", "schemas/v0.2/agentsml.schema.json", "schemas/v0.3/agentsml.schema.json"]:
              with open(path) as f:
                  s = json.load(f)
              jsonschema.Draft202012Validator.check_schema(s)
              print(f"✓ Valid schema: {path}")
          '

      - name: Check published schemas match schemas/
        run: python3 scripts/publish_schemas.py --check

      - name: Validate Example Documents
        run: |
          python -c '
          import glob, json, yaml, jsonschema
          import os
          def validator_for(version):
              # Validate each document against the schema for its declared version,
              # falling back to the canonical schema for unknown versions.
              path = f"schemas/v{version}/agentsml.schema.json"
              if not os.path.exists(path):
                  path = "schemas/agentsml.schema.json"
              with open(path) as f:
                  return jsonschema.Draft202012Validator(json.load(f))

          examples = glob.glob("examples/*.yaml")
          assert len(examples) >= 9, f"Expected at least 9 examples, found {len(examples)}"

          for ex in sorted(examples):
              with open(ex) as f:
                  doc = yaml.safe_load(f)
              errors = list(validator_for(str(doc.get("agentsml", ""))).iter_errors(doc))
              if errors:
                  print(f"✗ Failed: {ex}")
                  for err in errors:
                      print(" ", err.message)
                  raise SystemExit(1)
              print(f"✓ Valid: {ex}")
          '
