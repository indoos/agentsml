name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pyyaml

      - name: Validate JSON Schemas
        run: |
          python -c '
          import json, jsonschema
          for path in ["schemas/agentsml.schema.json", "schemas/v0.1/agentsml.schema.json", "schemas/v0.2/agentsml.schema.json"]:
              with open(path) as f:
                  s = json.load(f)
              jsonschema.Draft202012Validator.check_schema(s)
              print(f"✓ Valid schema: {path}")
          '

      - name: Validate Example Documents
        run: |
          python -c '
          import glob, json, yaml, jsonschema
          with open("schemas/v0.2/agentsml.schema.json") as f:
              schema = json.load(f)
          validator = jsonschema.Draft202012Validator(schema)
          
          examples = glob.glob("examples/*.yaml")
          assert len(examples) >= 8, f"Expected at least 8 examples, found {len(examples)}"
          
          for ex in sorted(examples):
              with open(ex) as f:
                  doc = yaml.safe_load(f)
              errors = list(validator.iter_errors(doc))
              if errors:
                  print(f"✗ Failed: {ex}")
                  for err in errors:
                      print(" ", err.message)
                  raise SystemExit(1)
              print(f"✓ Valid: {ex}")
          '
